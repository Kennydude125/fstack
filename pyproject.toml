[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fstack"
version = "0.1.0"
description = "Reproducible finance research tools for the fstack skill collection"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["tzdata>=2025.2; platform_system == 'Windows'"]

[tool.setuptools.packages.find]
include = ["fstack_tools*"]
